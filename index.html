
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Una sorpresa per Matte</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

canvas {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    display: block;
    touch-action: none;
}
</style>
</head>

<body>

<canvas id="screen"></canvas>

<script>
const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d");

let dpr = 1;

let fase = "rating";
let voto = 0;
let frame = 0;
let tempoInizio = performance.now();
let ultimoFrame = 0;

let messaggioRating = "";
let ratingVaiAvanti = false;
let tempoRating = 0;

let messaggioDomanda = "";

const ROSSO_CHIARO = [255, 35, 55];
const ROSSO_SCuro = [65, 0, 8];
const BIANCO = [255, 225, 225];


/* ==================================================
   CONFIGURAZIONE SCHERMO
================================================== */

function scalaSchermo() {
    const s = Math.min(
        window.innerWidth / 850,
        window.innerHeight / 680
    );

    canvas.style.width = `${950 * s}px`;
    canvas.style.height = `${750 * s}px`;

    dpr = Math.max(1, window.devicePixelRatio || 1);

    canvas.width = Math.round(950 * dpr);
    canvas.height = Math.round(750 * dpr);

    impostaCoordinate();
}

function impostaCoordinate() {
    ctx.setTransform(
        dpr, 0,
        0, -dpr,
        475 * dpr,
        375 * dpr
    );
}

window.addEventListener("resize", scalaSchermo);
scalaSchermo();


/* ==================================================
   COLORI
================================================== */

function colore(rgb, intensita) {
    intensita = Math.max(0, Math.min(1, intensita));

    return rgb.map(c => Math.floor(c * intensita));
}

function css(rgb) {
    return `rgb(${rgb[0]}, ${rgb[1]}, ${rgb[2]})`;
}


/* ==================================================
   PULIZIA SCHERMO
================================================== */

function pulisci() {
    ctx.save();

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, 950, 750);

    ctx.restore();
}


/* ==================================================
   TESTI
================================================== */

function testo(x, y, frase, dimensione, color,
               font = "Arial", stile = "bold") {

    if (!frase) return;

    ctx.save();

    ctx.scale(1, -1);

    ctx.fillStyle = css(color);
    ctx.font = `${stile} ${dimensione}px "${font}", sans-serif`;

    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";

    ctx.fillText(frase, x, -y);

    ctx.restore();
}


function testo_graduale(x, y, frase, dimensione,
                        color, progressione,
                        font = "Arial", stile = "bold") {

    progressione = Math.max(0, Math.min(1, progressione));

    if (progressione >= 1) {
        testo(x, y, frase, dimensione, color, font, stile);
    } else {
        const lettere = Math.floor(frase.length * progressione);

        testo(
            x, y,
            frase.slice(0, lettere),
            dimensione,
            color,
            font,
            stile
        );
    }
}


/* ==================================================
   PULSANTI
================================================== */

function pulsante(x, y, frase, intensita) {

    const c = colore([180, 0, 25], intensita);

    ctx.save();

    ctx.fillStyle = "rgb(35, 0, 8)";
    ctx.strokeStyle = css(c);
    ctx.lineWidth = 1;

    ctx.beginPath();
    ctx.rect(x - 65, y - 23, 130, 46);

    ctx.fill();
    ctx.stroke();

    ctx.restore();

    testo(
        x, y - 7,
        frase,
        15,
        colore(BIANCO, intensita)
    );
}


/* ==================================================
   VALUTAZIONE A STELLE
================================================== */

function schermata_rating(intensita) {

    pulisci();

    testo_graduale(
        0, 130,
        "Quanto sei curioso di scoprire cosa ti aspetta?",
        25,
        colore(ROSSO_CHIARO, intensita),
        intensita
    );

    for (let i = 0; i < 5; i++) {

        const x = -120 + i * 60;

        if (voto >= i + 1) {

            testo(
                x, -15,
                "★",
                45,
                colore([255, 190, 30], intensita)
            );

        } else {

            testo(
                x, -15,
                "☆",
                45,
                colore([170, 130, 50], intensita)
            );
        }
    }

    testo(
        0, -100,
        "Scegli le stelline...",
        14,
        [170, 170, 170]
    );

    if (messaggioRating) {
        testo(
            0, -155,
            messaggioRating,
            17,
            colore(ROSSO_CHIARO, intensita)
        );
    }
}


/* ==================================================
   DOMANDE CON COMPARSA E SCOMPARSA GRADUALE
================================================== */

function schermata_domanda(frase, trascorso) {

    pulisci();

    const comparsa = Math.min(1, trascorso / 1.5);

    const scomparsa = Math.min(
        1,
        Math.max(0, (8 - trascorso) / 1.5)
    );

    let intensita = Math.min(comparsa, scomparsa);

    if (trascorso >= 1.5) {
        intensita = scomparsa;
    }

    testo_graduale(
        0, 100,
        frase,
        27,
        colore(ROSSO_CHIARO, intensita),
        trascorso >= 1.5 ? 1 : comparsa
    );

    pulsante(-100, -30, "SÌ", intensita);
    pulsante(100, -30, "NO", intensita);

    if (messaggioDomanda) {
        testo(
            0, -115,
            messaggioDomanda,
            17,
            colore(ROSSO_CHIARO, intensita)
        );
    }
}


/* ==================================================
   ECCOLA QUA
================================================== */

function schermata_attesa(trascorso) {

    pulisci();

    let intensita;

    if (trascorso < 1.5) {
        intensita = trascorso / 1.5;
    } else if (trascorso < 4) {
        intensita = 1;
    } else {
        intensita = Math.max(0, 1 - (trascorso - 4));
    }

    testo_graduale(
        0, 0,
        "Eccola qua...",
        35,
        colore(ROSSO_CHIARO, intensita),
        Math.min(1, trascorso / 1.5)
    );
}


/* ==================================================
   FORMA DEL CUORE
================================================== */

function punti_cuore(scala, angolo = 0) {

    const punti = [];

    for (let i = 0; i < 361; i++) {

        const t = i * Math.PI / 180;

        let x = 16 * Math.pow(Math.sin(t), 3);

        let y =
            13 * Math.cos(t)
            - 5 * Math.cos(2 * t)
            - 2 * Math.cos(3 * t)
            - Math.cos(4 * t);

        x *= scala;
        y *= scala;

        const xr = x * Math.cos(angolo);

        punti.push([xr, y]);
    }

    return punti;
}


/* ==================================================
   DISEGNO DI UN POLIGONO
================================================== */

function disegnaPoligono(punti, fill, stroke = fill, lineWidth = 1) {

    if (!punti.length) return;

    ctx.beginPath();

    ctx.moveTo(punti[0][0], punti[0][1]);

    for (let i = 1; i < punti.length; i++) {
        ctx.lineTo(punti[i][0], punti[i][1]);
    }

    ctx.closePath();

    ctx.fillStyle = css(fill);
    ctx.fill();

    ctx.strokeStyle = css(stroke);
    ctx.lineWidth = lineWidth;
    ctx.stroke();
}


/* ==================================================
   CUORE CON PROFONDITÀ E SFUMATURE
================================================== */

function disegna_cuore_pieno(scala, angolo = 0) {

    const puntiOmbra = punti_cuore(
        scala * 1.06,
        angolo
    );

    disegnaPoligono(
        puntiOmbra,
        [30, 0, 5]
    );


    const colori = [
        [85, 0, 12],
        [105, 0, 15],
        [130, 0, 18],
        [155, 0, 22],
        [180, 0, 27],
        [205, 5, 32],
        [225, 10, 40],
        [245, 20, 50],
        [255, 40, 65],
        [255, 65, 80]
    ];

    for (let i = 0; i < colori.length; i++) {

        const fattore = 1 - i * 0.075;

        const punti = punti_cuore(
            scala * fattore,
            angolo
        );

        disegnaPoligono(
            punti,
            colori[i]
        );
    }


    if (Math.abs(Math.cos(angolo)) > 0.65) {

        ctx.beginPath();
        ctx.arc(-45, 90, 7.5, 0, Math.PI * 2);

        ctx.fillStyle = "rgb(255, 130, 140)";
        ctx.fill();

        ctx.beginPath();
        ctx.arc(-25, 105, 3.5, 0, Math.PI * 2);

        ctx.fillStyle = "rgb(255, 190, 190)";
        ctx.fill();
    }
}


/* ==================================================
   DISEGNO PROGRESSIVO DEL CUORE
================================================== */

function disegna_contorno(progressione) {

    const punti = punti_cuore(12);

    const quanti = Math.max(
        2,
        Math.floor(punti.length * progressione)
    );

    ctx.beginPath();

    ctx.moveTo(punti[0][0], punti[0][1]);

    for (let i = 1; i < quanti; i++) {
        ctx.lineTo(punti[i][0], punti[i][1]);
    }

    ctx.strokeStyle = css(ROSSO_CHIARO);
    ctx.lineWidth = 3;

    ctx.stroke();
}


/* ==================================================
   SCRITTE SUL CUORE
================================================== */

function scritte_cuore(progressione) {

    testo_graduale(
        0, -15,
        "Matte",
        43,
        [255, 220, 220],
        progressione,
        "Brush Script MT",
        "italic"
    );

    testo_graduale(
        0, -85,
        "TI VOGLIO BENE",
        15,
        [255, 100, 115],
        progressione
    );
}


/* ==================================================
   LUCI
================================================== */

function disegna_luci(intensita) {

    for (let i = 0; i < 30; i++) {

        const angolo =
            i * 2 * Math.PI / 30
            + frame * 0.008;

        const x = 245 * Math.cos(angolo);
        const y = 195 * Math.sin(angolo);

        const pulsazione =
            0.5 + 0.5 * Math.sin(frame * 0.1 + i);

        const luminosita = intensita * (
            0.5 + pulsazione * 0.5
        );

        const r = (3 + pulsazione * 5) / 2;

        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);

        ctx.fillStyle = css(
            colore(ROSSO_CHIARO, luminosita)
        );

        ctx.fill();
    }
}


/* ==================================================
   FIRMA LOTTY
================================================== */

function mostra_firma(progressione) {

    testo_graduale(
        330, -285,
        "Lotty",
        32,
        colore([230, 110, 130], progressione),
        progressione,
        "Brush Script MT",
        "italic"
    );
}


/* ==================================================
   CAMBIO FASE
================================================== */

function passa_a(nuova_fase) {

    fase = nuova_fase;
    tempoInizio = performance.now();
    frame = 0;

    messaggioDomanda = "";

    pulisci();
}


/* ==================================================
   CLICK
================================================== */

function click(event) {

    const rect = canvas.getBoundingClientRect();

    const x =
        (event.clientX - rect.left) * 950 / rect.width - 475;

    const y =
        375 - (event.clientY - rect.top) * 750 / rect.height;


    // ----------------------------------------------
    // STELLINE
    // ----------------------------------------------

    if (fase === "rating") {

        if (
            !ratingVaiAvanti &&
            x > -160 && x < 160 &&
            y > -70 && y < 50
        ) {

            let posizione = Math.round((x + 120) / 60) + 1;

            posizione = Math.max(1, Math.min(5, posizione));

            voto = posizione;

            const risposte = [
                "Solo una?! Mi stai deludendo! 😂",
                "Due stelline? Puoi fare di meglio!",
                "Tre? Mi aspettavo più entusiasmo!",
                "Quattro! Dai, manca pochissimo!",
                "Ecco! Questa è la risposta giusta! ❤️"
            ];

            messaggioRating = risposte[voto - 1];

            if (voto === 5) {

                ratingVaiAvanti = true;
                tempoRating = performance.now();

            } else {

                ratingVaiAvanti = false;
            }
        }
    }


    // ----------------------------------------------
    // PULSANTI SÌ E NO
    // ----------------------------------------------

    else if (fase === "domanda1" || fase === "domanda2") {

        if (y > -53 && y < -7) {

            // PULSANTE SÌ
            if (x > -165 && x < -35) {

                if (fase === "domanda1") {
                    passa_a("domanda2");
                } else {
                    passa_a("attesa");
                }
            }

            // PULSANTE NO
            else if (x > 35 && x < 165) {

                if (fase === "domanda1") {

                    messaggioDomanda =
                        "Eh no, ormai sei qui! 😂";

                } else {

                    messaggioDomanda =
                        "Lo sapevo che avresti detto no! 😏";
                }

                // Riparte il tempo della domanda
                tempoInizio = performance.now();
            }
        }
    }
}


// Riconoscimento immediato del tocco e del click.
canvas.addEventListener("pointerdown", event => {
    event.preventDefault();
    click(event);
});


/* ==================================================
   ANIMAZIONE PRINCIPALE
================================================== */

function animazione(ora) {

    requestAnimationFrame(animazione);

    if (ora - ultimoFrame < 35) {
        return;
    }

    ultimoFrame = ora;

    const trascorso =
        (performance.now() - tempoInizio) / 1000;

    frame++;


    // ----------------------------------------------
    // RATING
    // ----------------------------------------------

    if (fase === "rating") {

        const intensita = Math.min(1, trascorso / 1.5);

        schermata_rating(intensita);

        if (
            ratingVaiAvanti &&
            performance.now() - tempoRating >= 1200
        ) {
            passa_a("domanda1");
        }
    }


    // ----------------------------------------------
    // PRIMA DOMANDA
    // ----------------------------------------------

    else if (fase === "domanda1") {

        schermata_domanda(
            "Sei pronto a vedere la sorpresa?",
            trascorso
        );

        if (trascorso >= 8) {
            passa_a("domanda2");
        }
    }


    // ----------------------------------------------
    // SECONDA DOMANDA
    // ----------------------------------------------

    else if (fase === "domanda2") {

        schermata_domanda(
            "Sicuro sicuro?",
            trascorso
        );

        if (trascorso >= 8) {
            passa_a("attesa");
        }
    }


    // ----------------------------------------------
    // ECCOLA QUA
    // ----------------------------------------------

    else if (fase === "attesa") {

        schermata_attesa(trascorso);

        if (trascorso >= 5) {
            passa_a("cuore");
        }
    }


    // ----------------------------------------------
    // CUORE
    // ----------------------------------------------

    else if (fase === "cuore") {

        pulisci();

        if (trascorso < 3) {

            const progressione = trascorso / 3;

            disegna_contorno(progressione);
        }

        else if (trascorso < 4.5) {

            disegna_cuore_pieno(12);
        }

        else if (trascorso < 6.5) {

            disegna_cuore_pieno(12);

            const progressione = (trascorso - 4.5) / 2;

            scritte_cuore(progressione);
        }

        else {

            // Pulsazione

            const pulsazione =
                1 + 0.035 * Math.sin(frame * 0.08);


            // Rotazione verticale sul proprio asse

            const rotazione = frame * 0.025;

            disegna_cuore_pieno(
                12 * pulsazione,
                rotazione
            );

            scritte_cuore(1);

            disegna_luci(1);


            // Firma Lotty: compare solo alla fine

            if (trascorso > 9) {

                const progressione = Math.min(
                    1,
                    (trascorso - 9) / 2
                );

                mostra_firma(progressione);
            }
        }
    }
}


/* ==================================================
   AVVIO
================================================== */

requestAnimationFrame(animazione);

</script>

</body>
</html>
