<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Una sorpresa per te ❤️</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse at center, #240609, #050000 75%);
    color: white;
    font-family: Georgia, serif;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.screen {
    width: 100%;
    padding: 25px;
    position: absolute;
    opacity: 0;
    visibility: hidden;
    transition: opacity 1.2s ease;
}

.screen.active {
    opacity: 1;
    visibility: visible;
}

h1 {
    font-size: clamp(25px, 7vw, 38px);
    font-weight: normal;
    margin-bottom: 35px;
}

button {
    background: #8d1725;
    color: white;
    border: 1px solid #d99a9a;
    border-radius: 30px;
    padding: 13px 28px;
    font-size: 17px;
    margin: 10px;
    cursor: pointer;
    transition: .3s;
}

button:active { transform: scale(.95); }

.stars {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin: 25px 0;
}

.star {
    font-size: 42px;
    color: #555;
    cursor: pointer;
    transition: .3s;
}

.star.selected {
    color: #ffd45c;
    transform: scale(1.15);
}

#ratingMessage {
    min-height: 25px;
    color: #e9b6b6;
}

#surprise {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px;
    opacity: 0;
    visibility: hidden;
    transition: opacity 2s;
}

#surprise.show {
    opacity: 1;
    visibility: visible;
}

.intro {
    font-size: 24px;
    opacity: 0;
    transition: opacity 2s;
    margin-bottom: 25px;
}

.intro.show { opacity: 1; }

.heart-container {
    width: min(75vw, 330px);
    perspective: 900px;
    opacity: 0;
    transform: scale(.2);
    transition: opacity 3s, transform 3s;
}

.heart-container.show {
    opacity: 1;
    transform: scale(1);
}

.heart {
    width: 100%;
    overflow: visible;
    animation: heartbeat 2.2s ease-in-out infinite;
    transform-style: preserve-3d;
    filter: drop-shadow(0 18px 20px #000);
}

.heart path {
    stroke-dasharray: 1500;
    stroke-dashoffset: 1500;
    fill: transparent;
    stroke: #ff9a9a;
    stroke-width: 3;
    animation: drawHeart 4s ease forwards;
    animation-delay: 1s;
}

.heart path.filled {
    animation: drawHeart 4s ease forwards, fillHeart 2s ease forwards;
    animation-delay: 1s, 4s;
}

@keyframes drawHeart {
    to { stroke-dashoffset: 0; }
}

@keyframes fillHeart {
    to { fill: url(#ruby); }
}

@keyframes heartbeat {
    0%, 100% { transform: rotateY(-12deg) scale(1); }
    50% { transform: rotateY(12deg) scale(1.07); }
}

.name {
    font-family: "Brush Script MT", "Segoe Script", cursive;
    font-size: clamp(42px, 12vw, 65px);
    color: #ffe0e0;
    text-shadow: 0 3px 12px #7d0000;
    margin-top: -15px;
    opacity: 0;
    transition: opacity 2s;
}

.name.show { opacity: 1; }

.love {
    font-size: clamp(21px, 6vw, 30px);
    letter-spacing: 4px;
    margin-top: 25px;
    opacity: 0;
    transition: opacity 2s;
    color: #ffe5e5;
}

.love.show { opacity: 1; }

.lights {
    position: absolute;
    top: 0;
    width: 100%;
    display: flex;
    justify-content: space-around;
    padding: 15px 5px;
    opacity: 0;
    transition: opacity 3s;
}

.lights.show { opacity: 1; }

.light {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #ffe6a1;
    box-shadow: 0 0 12px 5px #d99a35;
    animation: twinkle 2s infinite alternate;
}

.light:nth-child(even) {
    animation-delay: 1s;
}

@keyframes twinkle {
    from { opacity: .3; }
    to { opacity: 1; }
}

.signature {
    position: absolute;
    bottom: 25px;
    right: 25px;
    font-family: "Brush Script MT", "Segoe Script", cursive;
    font-size: 32px;
    color: #e9baba;
    opacity: 0;
    transition: opacity 3s;
}

.signature.show { opacity: 1; }

.small {
    color: #d9aaaa;
    font-size: 15px;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="screen active" id="first">
    <h1>Quanto mi vuoi bene da 1 a 5?</h1>
    <div class="stars">
        <span class="star" data-value="1">★</span>
        <span class="star" data-value="2">★</span>
        <span class="star" data-value="3">★</span>
        <span class="star" data-value="4">★</span>
        <span class="star" data-value="5">★</span>
    </div>
    <p id="ratingMessage"></p>
    <button id="ratingButton" style="display:none" onclick="nextQuestion()">
        Conferma ❤️
    </button>
</div>

<div class="screen" id="second">
    <h1>Sei pronto a vedere la sorpresa?</h1>
    <button onclick="nextScreen('third')">SÌ ❤️</button>
    <button onclick="noAnswer()">NO</button>
    <p class="small" id="noMessage"></p>
</div>

<div class="screen" id="third">
    <h1>Sicuro sicuro?</h1>
    <button onclick="startSurprise()">SÌ!</button>
    <button onclick="noAnswer2()">NO</button>
    <p class="small" id="noMessage2"></p>
</div>

<div id="surprise">
    <div class="lights" id="lights"></div>

    <div class="intro" id="intro">
        Ho preparato una piccola cosa per te...
    </div>

    <div class="heart-container" id="heartContainer">
        <svg class="heart" viewBox="0 0 512 512">
            <defs>
                <linearGradient id="ruby" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ffb0b0"/>
                    <stop offset="25%" stop-color="#d90024"/>
                    <stop offset="55%" stop-color="#8b0018"/>
                    <stop offset="80%" stop-color="#4b000d"/>
                    <stop offset="100%" stop-color="#c90028"/>
                </linearGradient>
                <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="white" stop-opacity=".8"/>
                    <stop offset="100%" stop-color="white" stop-opacity="0"/>
                </linearGradient>
            </defs>

            <path class="filled"
                d="M256 465 C210 420 45 290 45 160
                C45 55 180 20 256 125
                C332 20 467 55 467 160
                C467 290 302 420 256 465 Z"/>

            <path d="M100 145 C105 80 175 60 220 105"
                fill="none" stroke="url(#shine)" stroke-width="12"
                stroke-linecap="round" opacity=".6"/>
        </svg>
    </div>

    <div class="name" id="matte">Matte</div>
    <div class="love" id="love">TI VOGLIO BENE</div>
    <div class="signature" id="signature">Lotty</div>
</div>

<script>
let selected = 0;

const stars = document.querySelectorAll(".star");

stars.forEach(star => {
    star.addEventListener("click", () => {
        selected = Number(star.dataset.value);

        stars.forEach(s => {
            s.classList.toggle(
                "selected",
                Number(s.dataset.value) <= selected
            );
        });

        document.getElementById("ratingMessage").textContent =
            selected === 5 ? "Lo sapevo! ❤️" : "Mmm... puoi fare di meglio!";

        document.getElementById("ratingButton").style.display =
            selected === 5 ? "inline-block" : "none";
    });
});

function showScreen(id) {
    document.querySelectorAll(".screen").forEach(s => {
        s.classList.remove("active");
    });

    setTimeout(() => {
        document.getElementById(id).classList.add("active");
    }, 300);
}

function nextQuestion() {
    showScreen("second");
}

function nextScreen(id) {
    showScreen(id);
}

function noAnswer() {
    document.getElementById("noMessage").textContent =
        "Daiii, non fare il timido! 🥺";
}

function noAnswer2() {
    document.getElementById("noMessage2").textContent =
        "Ormai sei arrivato fin qui... ❤️";
}

function startSurprise() {
    document.querySelectorAll(".screen").forEach(s => {
        s.classList.remove("active");
    });

    setTimeout(() => {
        document.getElementById("surprise").classList.add("show");
    }, 500);

    setTimeout(() => {
        document.getElementById("intro").classList.add("show");
    }, 1500);

    setTimeout(() => {
        document.getElementById("intro").classList.remove("show");
    }, 5000);

    setTimeout(() => {
        document.getElementById("heartContainer").classList.add("show");
    }, 5500);

    setTimeout(() => {
        document.getElementById("matte").classList.add("show");
    }, 9000);

    setTimeout(() => {
        document.getElementById("love").classList.add("show");
    }, 11000);

    setTimeout(() => {
        createLights();
        document.getElementById("lights").classList.add("show");
    }, 12500);

    setTimeout(() => {
        document.getElementById("signature").classList.add("show");
    }, 15000);
}

function createLights() {
    const container = document.getElementById("lights");

    for (let i = 0; i < 24; i++) {
        const light = document.createElement("div");
        light.className = "light";
        container.appendChild(light);
    }
}
</script>

</body>
</html>
