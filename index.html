<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Una sorpresa per Matte</title>

<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

#stage {
    position: absolute;
    width: 950px;
    height: 750px;
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%) scale(var(--scale,1));
    transform-origin: center;
}

svg {
    position: absolute;
    inset: 0;
    width: 950px;
    height: 750px;
}

#heart, #decorazioni, #firma {
    pointer-events: none;
}

#heart { z-index: 2; }
#decorazioni { z-index: 3; }
#firma { z-index: 4; }
#ui { z-index: 5; }

text {
    text-anchor: middle;
    font-family: Arial, sans-serif;
}

.click {
    cursor: pointer;
    pointer-events: all;
    -webkit-tap-highlight-color: transparent;
}
</style>
</head>

<body>

<div id="stage">
    <svg id="heart" viewBox="0 0 950 750"></svg>
    <svg id="decorazioni" viewBox="0 0 950 750"></svg>
    <svg id="firma" viewBox="0 0 950 750"></svg>
    <svg id="ui" viewBox="0 0 950 750"></svg>
</div>

<script>
const NS = "http://www.w3.org/2000/svg";

const ui = document.getElementById("ui");
const heart = document.getElementById("heart");
const decorazioni = document.getElementById("decorazioni");
const firma = document.getElementById("firma");

let fase = "rating";
let voto = 0;
let frame = 0;
let tempoInizio = performance.now();
let ultimoFrame = 0;

const ROSSO = [255,35,55];
const BIANCO = [255,225,225];

function scalaSchermo() {
    const s = Math.min(
        window.innerWidth / 950,
        window.innerHeight / 750
    );

    document.getElementById("stage")
        .style.setProperty("--scale",s);
}

window.addEventListener("resize",scalaSchermo);
scalaSchermo();

function colore(rgb,intensita=1) {
    intensita = Math.max(0,Math.min(1,intensita));

    return `rgb(${rgb.map(c =>
        Math.round(c*intensita)
    ).join(",")})`;
}

function elemento(tag,attributi,parent) {
    const e = document.createElementNS(NS,tag);

    for(const [k,v] of Object.entries(attributi)) {
        e.setAttribute(k,v);
    }

    parent.appendChild(e);
    return e;
}

/* TESTI */

function testo(t,x,y,frase,dimensione,color,
               font="Arial",stile="bold") {

    const e = elemento("text",{
        x:475+x,
        y:375-y,
        fill:color,
        "font-size":dimensione,
        "font-family":font,
        "font-weight":stile==="bold"?"bold":"normal",
        "font-style":stile==="italic"?"italic":"normal",
        "text-anchor":"middle"
    },t);

    e.textContent=frase;
    return e;
}

function testo_graduale(t,x,y,frase,dimensione,color,
                        progressione,font="Arial",stile="bold") {

    progressione=Math.max(0,Math.min(1,progressione));

    const lettere=Math.floor(frase.length*progressione);

    testo(t,x,y,frase.slice(0,lettere),
          dimensione,color,font,stile);
}

/* CAMBIO SCHERMATA */

function passa_a(nuovaFase) {
    fase=nuovaFase;
    tempoInizio=performance.now();
    frame=0;

    ui.innerHTML="";
    heart.innerHTML="";
    decorazioni.innerHTML="";
    firma.innerHTML="";

    if(fase==="rating") schermata_rating();

    if(fase==="domanda1")
        schermata_domanda("Sei pronto a vedere la sorpresa?");

    if(fase==="domanda2")
        schermata_domanda("Sicuro sicuro?");

    if(fase==="attesa")
        schermata_attesa();
}

/* STELLINE */

function schermata_rating() {
    ui.innerHTML="";

    testo(ui,0,130,
        "Quanto mi vuoi bene da 1 a 5?",
        25,ROSSO);

    for(let i=0;i<5;i++) {
        const x=-120+i*60;

        const stella=elemento("text",{
            x:475+x,
            y:375-(-15),
            fill:"rgb(170,130,50)",
            "font-size":45,
            "text-anchor":"middle",
            "class":"click"
        },ui);

        stella.textContent="☆";

        stella.addEventListener("click",()=>{
            voto=i+1;

            aggiorna_stelle();

            if(voto===5) {
                setTimeout(()=>passa_a("domanda1"),180);
            }
        });
    }

    testo(ui,0,-100,
        "Scegli le stelline...",
        14,"rgb(170,170,170)");
}

function aggiorna_stelle() {
    const stelle=ui.querySelectorAll(".click");

    stelle.forEach((stella,i)=>{
        stella.textContent=i<voto?"★":"☆";

        stella.setAttribute(
            "fill",
            i<voto?"rgb(255,190,30)":"rgb(170,130,50)"
        );
    });
}

/* PULSANTI */

function pulsante(x,y,frase,azione) {
    const g=elemento("g",{"class":"click"},ui);

    elemento("rect",{
        x:475+x-65,
        y:375-(y+23),
        width:130,
        height:46,
        stroke:"rgb(180,0,25)",
        fill:"rgb(35,0,8)",
        "stroke-width":1,
        rx:5
    },g);

    testo(g,x,y-7,frase,15,
        "rgb(255,225,225)");

    g.addEventListener("click",e=>{
        e.stopPropagation();
        if(azione) azione();
    });

    return g;
}

/* DOMANDE */

function schermata_domanda(frase) {
    ui.innerHTML="";

    const titolo=testo(ui,0,100,"",27,
        "rgb(255,35,55)");

    const si=pulsante(-100,-30,"SÌ",()=>{
        if(fase==="domanda1") passa_a("domanda2");
        else passa_a("attesa");
    });

    const no=pulsante(100,-30,"NO",()=>{
        if(fase==="domanda1") passa_a("domanda2");
        else passa_a("attesa");
    });

    const durata=1500;
    const inizio=performance.now();

    function comparsa() {
        if(fase!=="domanda1" && fase!=="domanda2") return;

        const p=Math.min(1,(performance.now()-inizio)/durata);
        const n=Math.floor(frase.length*p);

        titolo.textContent=frase.slice(0,n);
        titolo.setAttribute("opacity",p);

        si.setAttribute("opacity",p);
        no.setAttribute("opacity",p);

        if(p<1) requestAnimationFrame(comparsa);
    }

    comparsa();

    setTimeout(()=>{
        if(fase==="domanda1") passa_a("domanda2");
        else if(fase==="domanda2") passa_a("attesa");
    },8000);
}

/* ATTESA */

function schermata_attesa() {
    ui.innerHTML="";

    const scritta=testo(ui,0,0,"",35,ROSSO);

    const frase="Eccola qua...";
    const inizio=performance.now();

    function comparsa() {
        if(fase!=="attesa") return;

        const p=Math.min(1,(performance.now()-inizio)/1500);

        scritta.textContent=frase.slice(
            0,Math.floor(frase.length*p)
        );

        if(p<1) requestAnimationFrame(comparsa);
    }

    comparsa();

    setTimeout(()=>{
        if(fase==="attesa") passa_a("cuore");
    },5000);
}

/* FORMA DEL CUORE */

function punti_cuore(scala) {
    const punti=[];

    for(let i=0;i<=360;i++) {
        const t=i*Math.PI/180;

        const x=16*Math.pow(Math.sin(t),3);

        const y=13*Math.cos(t)
            -5*Math.cos(2*t)
            -2*Math.cos(3*t)
            -Math.cos(4*t);

        punti.push([
            475+x*scala,
            375-y*scala
        ]);
    }

    return punti;
}

function path_punti(punti,chiuso=true) {
    let d=punti.map((p,i)=>
        (i===0?"M":"L")+p[0]+" "+p[1]
    ).join(" ");

    if(chiuso) d+=" Z";

    return d;
}

/* CUORE CHE GIRA SUL PROPRIO ASSE VERTICALE */

function disegna_cuore_pieno(scala,angolo=0) {
    heart.innerHTML="";

    const larghezza=Math.abs(Math.cos(angolo));

    const punti=punti_cuore(scala);

    function deforma(lista) {
        return lista.map(([x,y])=>[
            475+(x-475)*larghezza,
            y
        ]);
    }

    /* Ombra */

    const ombra=deforma(punti_cuore(scala*1.06));

    elemento("path",{
        d:path_punti(ombra),
        fill:"rgb(30,0,5)"
    },heart);

    /* Riempimento a strati */

    const colori=[
        [85,0,12],
        [105,0,15],
        [130,0,18],
        [155,0,22],
        [180,0,27],
        [205,5,32],
        [225,10,40],
        [245,20,50],
        [255,40,65],
        [255,65,80]
    ];

    colori.forEach((c,i)=>{
        const fattore=1-i*0.075;

        const p=deforma(
            punti_cuore(scala*fattore)
        );

        elemento("path",{
            d:path_punti(p),
            fill:`rgb(${c.join(",")})`
        },heart);
    });

    /* Riflessi */

    if(larghezza>0.25) {
        elemento("ellipse",{
            cx:475-45*larghezza,
            cy:285,
            rx:7*larghezza,
            ry:7.5,
            fill:"rgb(255,130,140)"
        },heart);

        elemento("ellipse",{
            cx:475-25*larghezza,
            cy:270,
            rx:3.5*larghezza,
            ry:3.5,
            fill:"rgb(255,190,190)"
        },heart);
    }
}

/* CONTORNO */

function disegna_contorno(progressione) {
    heart.innerHTML="";

    const punti=punti_cuore(12);

    const quanti=Math.max(
        2,
        Math.floor(punti.length*progressione)
    );

    elemento("path",{
        d:path_punti(punti.slice(0,quanti),false),
        fill:"none",
        stroke:"rgb(255,35,55)",
        "stroke-width":3
    },heart);
}

/* SCRITTE NEL CUORE */

function scritte_cuore(progressione) {
    decorazioni.innerHTML="";

    testo_graduale(
        decorazioni,0,-15,
        "Matte",43,
        "rgb(255,220,220)",
        progressione,
        "Brush Script MT","italic"
    );

    testo_graduale(
        decorazioni,0,-85,
        "TI VOGLIO BENE",15,
        "rgb(255,100,115)",
        progressione
    );
}

/* LUCI */

function disegna_luci(intensita) {
    for(let i=0;i<30;i++) {
        const angolo=i*2*Math.PI/30+frame*0.008;

        const x=475+245*Math.cos(angolo);
        const y=375-195*Math.sin(angolo);

        const pulsazione=0.5+0.5*Math.sin(frame*0.1+i);

        const luminosita=intensita*(0.5+pulsazione*0.5);

        elemento("circle",{
            cx:x,
            cy:y,
            r:3+pulsazione*2.5,
            fill:colore(ROSSO,luminosita)
        },decorazioni);
    }
}

/* FIRMA */

function mostra_firma(progressione) {
    firma.innerHTML="";

    testo_graduale(
        firma,330,-285,
        "Lotty",32,
        colore([230,110,130],progressione),
        progressione,
        "Brush Script MT","italic"
    );
}

/* ANIMAZIONE PRINCIPALE */

function animazione(ora) {
    requestAnimationFrame(animazione);

    if(ora-ultimoFrame<33) return;
    ultimoFrame=ora;

    if(fase!=="cuore") return;

    const trascorso=(performance.now()-tempoInizio)/1000;

    frame++;

    if(trascorso<3) {
        disegna_contorno(trascorso/3);
    }

    else if(trascorso<4.5) {
        disegna_cuore_pieno(12);
    }

    else if(trascorso<6.5) {
        disegna_cuore_pieno(12);
        scritte_cuore((trascorso-4.5)/2);
    }

    else {
        const pulsazione=1+0.035*Math.sin(frame*0.08);

        /* Rotazione verticale sul proprio asse */

        const rotazione=frame*0.025;

        disegna_cuore_pieno(
            12*pulsazione,
            rotazione
        );

        scritte_cuore(1);
        disegna_luci(1);

        if(trascorso>9) {
            const progressione=Math.min(
                1,(trascorso-9)/2
            );

            mostra_firma(progressione);
        }
    }
}

/* AVVIO */

schermata_rating();
requestAnimationFrame(animazione);

</script>
</body>
</html>
