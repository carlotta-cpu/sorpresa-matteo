<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Una sorpresa per Matte</title>

<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
    color: white;
    font-family: Arial, sans-serif;
}

#scene {
    position: relative;
    width: 100%;
    height: 100%;
    background: black;
    display: flex;
    align-items: center;
    justify-content: center;
}

#canvas {
    position: relative;
    width: min(100vw, 126.67vh);
    height: min(100vh, 78.95vw);
    aspect-ratio: 950 / 750;
}

.layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}

svg {
    overflow: visible;
}

#ui, #heart, #decorazioni, #firma {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}

#ui { z-index: 5; }
#heart { z-index: 2; }
#decorazioni { z-index: 3; }
#firma { z-index: 4; }

text {
    text-anchor: middle;
    dominant-baseline: auto;
}

.click-area {
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

button {
    border: none;
    background: transparent;
    padding: 0;
}

</style>
</head>

<body>
<div id="scene">
<div id="canvas">

<svg id="heart" viewBox="0 0 950 750"></svg>
<svg id="decorazioni" viewBox="0 0 950 750"></svg>
<svg id="ui" viewBox="0 0 950 750"></svg>
<svg id="firma" viewBox="0 0 950 750"></svg>

</div>
</div>

<script>
const NS = "http://www.w3.org/2000/svg";

const ui = document.getElementById("ui");
const heart = document.getElementById("heart");
const decorazioni = document.getElementById("decorazioni");
const firma = document.getElementById("firma");

const ROSSO_CHIARO = [255,35,55];
const BIANCO = [255,225,225];

let fase = "rating";
let voto = 0;
let frame = 0;
let tempoInizio = performance.now();
let ultimoFrame = 0;

function colore(rgb, intensita) {
    intensita = Math.max(0, Math.min(1, intensita));
    return `rgb(${rgb.map(c => Math.round(c*intensita)).join(",")})`;
}

function el(tag, attrs = {}, parent = ui) {
    const e = document.createElementNS(NS, tag);
    for (const [k,v] of Object.entries(attrs)) {
        e.setAttribute(k,v);
    }
    parent.appendChild(e);
    return e;
}

function testo(parent, x, y, frase, dimensione, color,
               font="Arial", stile="bold") {
    const t = el("text", {
        x, y,
        fill: color,
        "font-size": dimensione,
        "font-family": font,
        "font-weight": stile === "bold" ? "bold" : "normal",
        "font-style": stile === "italic" ? "italic" : "normal",
        "text-anchor": "middle"
    }, parent);
    t.textContent = frase;
    return t;
}

function testoGraduale(parent,x,y,frase,dimensione,color,progressione,
                       font="Arial",stile="bold") {
    progressione = Math.max(0,Math.min(1,progressione));
    const lettere = progressione >= 1
        ? frase.length
        : Math.floor(frase.length * progressione);

    return testo(parent,x,y,frase.slice(0,lettere),
                 dimensione,color,font,stile);
}

function pulsante(x,y,frase,intensita) {
    const g = el("g",{"class":"click-area"},ui);

    el("rect",{
        x:x-65,y:750-(y+23),
        width:130,height:46,
        fill:"rgb(35,0,8)",
        stroke:colore([180,0,25],intensita),
        "stroke-width":2
    },g);

    testo(g,x,750-(y-7),frase,15,
          colore(BIANCO,intensita));

    return g;
}

function schermataRating(intensita) {
    ui.innerHTML = "";

    testoGraduale(ui,475,620,
        "Quanto mi vuoi bene da 1 a 5?",
        25,colore(ROSSO_CHIARO,intensita),intensita);

    for(let i=0;i<5;i++) {
        const x = 475 + (-120+i*60);
        const y = 750-(-15);

        testo(ui,x,y,voto>=i+1?"★":"☆",45,
            voto>=i+1
            ? colore([255,190,30],intensita)
            : colore([170,130,50],intensita));

        const hit = el("rect",{
            x:x-27,y:y-55,width:54,height:65,
            fill:"transparent",
            "class":"click-area"
        },ui);

        hit.addEventListener("click",()=>{
            const posizione = i+1;
            voto = posizione;
            if(voto===5) passaA("domanda1");
        });
    }

    testo(ui,475,850-750,"Scegli le stelline...",14,
        "rgb(170,170,170)");
}

function schermataDomanda(frase,trascorso) {
    ui.innerHTML="";

    const comparsa=Math.min(1,trascorso/1.5);
    const scomparsa=Math.min(1,Math.max(0,(8-trascorso)/1.5));
    let intensita=Math.min(comparsa,scomparsa);

    if(trascorso>=1.5) intensita=scomparsa;

    testoGraduale(ui,475,650,frase,27,
        colore(ROSSO_CHIARO,intensita),
        trascorso>=1.5?1:comparsa);

    const si=pulsante(375,780-750,"SÌ",intensita);
    const no=pulsante(575,780-750,"NO",intensita);

    si.addEventListener("click",()=>{
        if(fase==="domanda1") passaA("domanda2");
        else passaA("attesa");
    });

    no.addEventListener("click",()=>{
        if(fase==="domanda1") passaA("domanda2");
        else passaA("attesa");
    });
}

function schermataAttesa(trascorso) {
    ui.innerHTML="";

    let intensita;
    if(trascorso<1.5) intensita=trascorso/1.5;
    else if(trascorso<4) intensita=1;
    else intensita=Math.max(0,1-(trascorso-4));

    testoGraduale(ui,475,375,"Eccola qua...",35,
        colore(ROSSO_CHIARO,intensita),
        Math.min(1,trascorso/1.5));
}

function puntiCuore(scala,angolo=0) {
    const punti=[];

    for(let i=0;i<=360;i++) {
        const t=i*Math.PI/180;

        let x=16*Math.pow(Math.sin(t),3);
        let y=13*Math.cos(t)-5*Math.cos(2*t)
            -2*Math.cos(3*t)-Math.cos(4*t);

        x*=scala;
        y*=scala;

        const xr=x*Math.cos(angolo);

        punti.push([475+xr,375-y]);
    }
    return punti;
}

function percorso(punti) {
    return punti.map((p,i)=>
        (i===0?"M":"L")+p[0]+" "+p[1]
    ).join(" ")+" Z";
}

function disegnaContorno(progressione) {
    heart.innerHTML="";
    const punti=puntiCuore(12);
    const quanti=Math.max(2,Math.floor(punti.length*progressione));

    el("path",{
        d:punti.slice(0,quanti).map((p,i)=>
            (i===0?"M":"L")+p[0]+" "+p[1]
        ).join(" "),
        fill:"none",
        stroke:"rgb(255,35,55)",
        "stroke-width":3
    },heart);
}

function disegnaCuorePieno(scala,angolo=0) {
    heart.innerHTML="";

    const colori=[
        [85,0,12],[105,0,15],[130,0,18],
        [155,0,22],[180,0,27],[205,5,32],
        [225,10,40],[245,20,50],[255,40,65],[255,65,80]
    ];

    const ombra=puntiCuore(scala*1.06,angolo);
    el("path",{d:percorso(ombra),fill:"rgb(30,0,5)"},heart);

    for(let i=0;i<colori.length;i++) {
        const fattore=1-i*0.075;
        const punti=puntiCuore(scala*fattore,angolo);

        el("path",{
            d:percorso(punti),
            fill:`rgb(${colori[i].join(",")})`
        },heart);
    }

    if(Math.abs(Math.cos(angolo))>0.65) {
        el("ellipse",{
            cx:430,cy:285,rx:7.5,ry:7.5,
            fill:"rgb(255,130,140)"
        },heart);

        el("ellipse",{
            cx:450,cy:270,rx:3.5,ry:3.5,
            fill:"rgb(255,190,190)"
        },heart);
    }
}

function scritteCuore(progressione) {
    decorazioni.innerHTML="";

    testoGraduale(decorazioni,475,390,
        "Matte",43,"rgb(255,220,220)",
        progressione,"Brush Script MT","italic");

    testoGraduale(decorazioni,475,460,
        "TI VOGLIO BENE",15,
        "rgb(255,100,115)",progressione);
}

function disegnaLuci(intensita) {
    for(let i=0;i<30;i++) {
        const angolo=i*2*Math.PI/30+frame*0.008;

        const x=475+245*Math.cos(angolo);
        const y=375-195*Math.sin(angolo);

        const pulsazione=0.5+0.5*Math.sin(frame*0.1+i);
        const luminosita=intensita*(0.5+pulsazione*0.5);

        el("circle",{
            cx:x,cy:y,
            r:3+pulsazione*2.5,
            fill:colore(ROSSO_CHIARO,luminosita)
        },decorazioni);
    }
}

function mostraFirma(progressione) {
    firma.innerHTML="";

    testoGraduale(firma,805,660,
        "Lotty",32,
        colore([230,110,130],progressione),
        progressione,"Brush Script MT","italic");
}

function passaA(nuovaFase) {
    fase=nuovaFase;
    tempoInizio=performance.now();
    frame=0;

    ui.innerHTML="";
    heart.innerHTML="";
    decorazioni.innerHTML="";
    firma.innerHTML="";
}

function animazione(timestamp) {
    if(timestamp-ultimoFrame<35) {
        requestAnimationFrame(animazione);
        return;
    }

    ultimoFrame=timestamp;

    const trascorso=(timestamp-tempoInizio)/1000;
    frame++;

    if(fase==="rating") {
        schermataRating(Math.min(1,trascorso/1.5));
    }

    else if(fase==="domanda1") {
        schermataDomanda("Sei pronto a vedere la sorpresa?",trascorso);
        if(trascorso>=8) passaA("domanda2");
    }

    else if(fase==="domanda2") {
        schermataDomanda("Sicuro sicuro?",trascorso);
        if(trascorso>=8) passaA("attesa");
    }

    else if(fase==="attesa") {
        schermataAttesa(trascorso);
        if(trascorso>=5) passaA("cuore");
    }

    else if(fase==="cuore") {
        if(trascorso<3) {
            disegnaContorno(trascorso/3);
        }

        else if(trascorso<4.5) {
            disegnaCuorePieno(12);
        }

        else if(trascorso<6.5) {
            disegnaCuorePieno(12);
            scritteCuore((trascorso-4.5)/2);
        }

        else {
            const pulsazione=1+0.035*Math.sin(frame*0.08);
            const rotazione=frame*0.025;

            disegnaCuorePieno(12*pulsazione,rotazione);
            scritteCuore(1);

            decorazioni.innerHTML="";
            disegnaLuci(1);

            if(trascorso>9) {
                const progressione=Math.min(1,(trascorso-9)/2);
                mostraFirma(progressione);
            }
        }
    }

    requestAnimationFrame(animazione);
}

requestAnimationFrame(animazione);
</script>
</body>
</html>
